[package]
name = "forever"
version = "0.1.0"
edition = "2024"
description = "Fury warrior DPS simulator and pre-raid gear optimizer for World of Warcraft: Forever"
license = "MIT"

[dependencies]
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false

[profile.dev]
opt-level = 2

[profile.test]
opt-level = 3
